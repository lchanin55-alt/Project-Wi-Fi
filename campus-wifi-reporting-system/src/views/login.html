<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - Campus Wi-Fi Reporting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-container {
      max-width: 440px;
      margin: 40px auto;
      background: var(--bg-card);
      padding: 32px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-md);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .alert-error {
      background-color: var(--status-bad-bg);
      color: var(--status-bad-text);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div>
        <h1>📶 ระบบแจ้งและติดตามปัญหา Wi-Fi มหาวิทยาลัย</h1>
      </div>
    </div>
  </header>

  <nav>
    <div class="wrap">
      <a href="index.html">หน้าแรก</a>
      <a href="report.html">แจ้งเน็ตช้า</a>
      <a href="it-dashboard.html">สำหรับ IT</a>
      <a href="qa-report.html">ระบบ QA (ใบงานที่ 5)</a>
      <a href="login.html" class="active">เข้าสู่ระบบ</a>
      <a href="register.html">สมัครสมาชิก</a>
    </div>
  </nav>

  <main class="wrap">
    <div class="auth-container">
      <div class="auth-header">
        <h2>🔐 เข้าสู่ระบบ</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">เข้าใช้งานด้วยบัญชี @psru.ac.th</p>
      </div>

      <div id="errorMessage" class="alert-error"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">อีเมลมหาวิทยาลัย</label>
          <input type="email" id="email" placeholder="65123456@psru.ac.th" required>
        </div>

        <div class="form-group">
          <label for="password">รหัสผ่าน</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn primary" style="width: 100%; margin-top: 12px;">
          เข้าสู่ระบบ
        </button>

        <p style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted);">
          ยังไม่มีบัญชี? <a href="register.html" style="color: var(--primary); font-weight: 600;">สมัครสมาชิกที่นี่</a>
        </p>
      </form>
    </div>
  </main>

  <script type="module">
    import { loginUser } from '../controllers/authController.js';

    const form = document.getElementById('loginForm');
    const errBox = document.getElementById('errorMessage');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      errBox.style.display = 'none';

      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;

      try {
        const user = loginUser(email, pass);
        alert(`ยินดีต้อนรับคุณ ${user.name}`);
        window.location.href = 'index.html';
      } catch (err) {
        errBox.textContent = err.message;
        errBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
